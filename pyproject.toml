[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-fpa-financial-model"
version = "0.1.0"
description = "A SaaS FP&A toolkit: synthetic data generation, a linked three-statement model, SaaS KPIs, a driver-based budget, variance analysis, and a rolling cash flow forecast."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.24",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
